<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Blog - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <nav>

        <h2>My Blog</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="create-blog.html">Create Blog</a>

            <a href="login.html">Logout</a>

        </div>

    </nav>


    <section class="form-container">

        <h1 id="formTitle">
            Create Blog
        </h1>


        <form id="blogForm">

            <label for="title">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter your blog title"
                required
            >


            <label for="category">
                Category
            </label>

            <input
                type="text"
                id="category"
                placeholder="Enter blog category"
                required
            >


            <label for="content">
                Blog Content
            </label>

            <textarea
                id="content"
                placeholder="Write your blog here..."
                rows="8"
                required
            ></textarea>


            <button
                type="submit"
                id="publishButton"
            >
                Publish Blog
            </button>

        </form>

    </section>

</body>

</html>
