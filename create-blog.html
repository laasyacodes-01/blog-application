<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog - Blog Application</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Create Blog</h1>

        <form id="blogForm">

            <input
                type="text"
                id="title"
                placeholder="Blog title"
                required
            >

            <input
                type="text"
                id="category"
                placeholder="Blog category"
                required
            >

            <textarea
                id="content"
                placeholder="Write your blog content..."
                rows="8"
                required
            ></textarea>

            <button type="submit">Publish Blog</button>

        </form>

        <p id="message"></p>

        <p>
            <a href="dashboard.html">Go to Dashboard</a>
        </p>

    </div>


    <script>

        const blogForm =
            document.getElementById("blogForm");

        const message =
            document.getElementById("message");


        // ==================== CHECK LOGIN ====================

        const token =
            localStorage.getItem("token");


        if (!token) {

            window.location.href =
                "login.html";

        }


        // ==================== CREATE BLOG ====================

        blogForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const title =
                    document.getElementById("title").value;

                const content =
                    document.getElementById("content").value;


                try {

                    const response =
                        await fetch(
                            "https://blog-application-2-ig7h.onrender.com/api/blogs",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body: JSON.stringify({
                                    title: title,
                                    content: content
                                })
                            }
                        );


                    const data =
                        await response.json();


                    // ====================
                    // TOKEN ERROR
                    // ====================

                    if (
                        response.status === 401 ||
                        response.status === 403
                    ) {

                        localStorage.removeItem(
                            "token"
                        );

                        localStorage.removeItem(
                            "loggedInUser"
                        );

                        window.location.href =
                            "login.html";

                        return;

                    }


                    // ====================
                    // SUCCESS
                    // ====================

                    if (response.ok) {

                        message.textContent =
                            data.message;

                        blogForm.reset();

                    } else {

                        message.textContent =
                            data.message;

                    }


                } catch (error) {

                    message.textContent =
                        "Unable to connect to the backend server.";

                    console.error(error);

                }

            }
        );

    </script>

</body>
</html>
