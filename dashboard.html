<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>

        <h2>My Blog</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="create-blog.html">Create Blog</a>

            <a href="login.html">Logout</a>

        </div>

    </nav>


    <section class="dashboard">

        <h1>My Dashboard</h1>

        <p>
            Welcome to your blog dashboard.
        </p>


        <!-- Dashboard Counters -->

        <div class="dashboard-cards">

            <div class="dashboard-card">

                <h2 id="totalBlogs">0</h2>

                <p>Total Blogs</p>

            </div>


            <div class="dashboard-card">

                <h2 id="publishedBlogs">0</h2>

                <p>Published Blogs</p>

            </div>


            <div class="dashboard-card">

                <h2 id="draftBlogs">0</h2>

                <p>Drafts</p>

            </div>

        </div>


        <!-- Blog Search -->

        <div class="blog-search">

            <input
                type="text"
                id="searchBlog"
                placeholder="Search blogs..."
            >

        </div>


        <!-- Blog List -->

        <div id="blogDisplay"></div>


        <!-- Create Blog -->

        <a href="create-blog.html" class="button">

            Create New Blog

        </a>

    </section>


    <script>

        let allBlogs = [];


        // Get blogs from backend

        async function loadBlogs() {

            const blogDisplay =
                document.getElementById("blogDisplay");


            try {

                const response = await fetch(
                    "http://localhost:5000/api/blogs"
                );


                const data = await response.json();


                allBlogs = data.blogs || [];


                displayBlogs(allBlogs);


                updateCounters(allBlogs);


            } catch (error) {

                console.error(error);

                blogDisplay.innerHTML =
                    "<p>Unable to connect to the backend server.</p>";

            }

        }


        // Display blogs

        function displayBlogs(blogs) {

            const blogDisplay =
                document.getElementById("blogDisplay");


            blogDisplay.innerHTML = "";


            if (blogs.length === 0) {

                blogDisplay.innerHTML =
                    "<p>No blogs found.</p>";

                return;

            }


            blogs.forEach(function(blog) {

                const blogCard =
                    document.createElement("div");


                blogCard.className =
                    "blog-card";


                blogCard.innerHTML = `

                    <h2>${blog.title}</h2>

                    <p>
                        <strong>Category:</strong>
                        ${blog.category}
                    </p>

                    <p>
                        ${blog.content}
                    </p>

                `;


                blogDisplay.appendChild(blogCard);

            });

        }


        // Update dashboard counters

        function updateCounters(blogs) {

            document.getElementById("totalBlogs").textContent =
                blogs.length;


            document.getElementById("publishedBlogs").textContent =
                blogs.length;


            document.getElementById("draftBlogs").textContent =
                0;

        }


        // Search blogs

        document
            .getElementById("searchBlog")
            .addEventListener("input", function() {

                const searchText =
                    this.value.toLowerCase();


                const filteredBlogs =
                    allBlogs.filter(function(blog) {

                        return (

                            blog.title
                                .toLowerCase()
                                .includes(searchText)

                            ||

                            blog.category
                                .toLowerCase()
                                .includes(searchText)

                            ||

                            blog.content
                                .toLowerCase()
                                .includes(searchText)

                        );

                    });


                displayBlogs(filteredBlogs);

            });


        // Load blogs when page opens

        loadBlogs();

    </script>

</body>

</html>
