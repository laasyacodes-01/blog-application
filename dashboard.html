<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <h2>My Blog</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html">Login</a>
        </div>

    </nav>


    <!-- Dashboard -->

    <section class="dashboard">

        <h1>My Dashboard</h1>

        <p>Total Blogs: <span id="totalBlogs">0</span></p>

        <div id="blogList">

            <p>Loading blogs...</p>

        </div>

    </section>


    <script>

        async function loadBlogs() {

            const blogList =
                document.getElementById("blogList");

            const totalBlogs =
                document.getElementById("totalBlogs");

            try {

                const response = await fetch(
                    "http://localhost:5000/api/blogs"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch blogs");
                }

                const blogs = await response.json();

                console.log("Blogs received:", blogs);

                totalBlogs.textContent = blogs.length;

                blogList.innerHTML = "";


                if (blogs.length === 0) {

                    blogList.innerHTML =
                        "<p>No blogs found.</p>";

                    return;
                }


                blogs.forEach(function (blog) {

                    const blogCard =
                        document.createElement("div");

                    blogCard.className = "blog-card";


                    blogCard.innerHTML = `

                        <h2>${blog.title}</h2>

                        <p>
                            <strong>Author:</strong>
                            ${blog.author}
                        </p>

                        <p>
                            ${blog.content}
                        </p>

                        <p>
                            <strong>Published:</strong>
                            ${new Date(blog.created_at)
                                .toLocaleDateString()}
                        </p>

                        <a
                            href="blog-details.html?id=${blog.id}"
                            class="button">
                            Read More
                        </a>

                    `;


                    blogList.appendChild(blogCard);

                });


            } catch (error) {

                console.error("Dashboard error:", error);

                blogList.innerHTML = `
                    <p>
                        Unable to load blogs.
                        Please make sure the backend server is running.
                    </p>
                `;

            }

        }


        loadBlogs();

    </script>

</body>

</html>
