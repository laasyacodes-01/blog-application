<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - My Blog</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .dashboard {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .blog-card {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .blog-card h2 {
            margin-bottom: 10px;
        }

        .blog-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-button {
            display: inline-block;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .edit-button {
            background: #f0ad4e;
            color: white;
        }

        .delete-button {
            background: #d9534f;
            color: white;
        }

        .read-button {
            background: #007bff;
            color: white;
        }

        .logout-button {
            background: #333;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        .edit-button:hover {
            background: #ec971f;
        }

        .delete-button:hover {
            background: #c9302c;
        }

        .read-button:hover {
            background: #0056b3;
        }

        .logout-button:hover {
            background: #111;
        }

        #message {
            margin: 20px 0;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <!-- Navigation -->

    <nav>

        <h2>My Blog</h2>

        <div>

            <a href="index.html">Home</a>

            <a href="dashboard.html">Dashboard</a>

            <a href="create-blog.html">Create Blog</a>

            <button
                class="logout-button"
                onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- Dashboard -->

    <section class="dashboard">

        <h1>My Dashboard</h1>

        <p>
            Welcome,
            <strong id="userName"></strong>
        </p>

        <p>
            Total Blogs:
            <span id="totalBlogs">0</span>
        </p>

        <div id="message"></div>

        <div id="blogList">

            <p>Loading blogs...</p>

        </div>

    </section>


    <script>

        const API_URL = "https://blog-application-2-ig7h.onrender.com";

        // ==================== CHECK LOGIN ====================

        const token =
            localStorage.getItem("token");

        const loggedInUser =
            localStorage.getItem("loggedInUser");


        if (!token) {

            window.location.href =
                "login.html";

        }


        // ==================== SHOW USER NAME ====================

        if (loggedInUser) {

            const user =
                JSON.parse(loggedInUser);

            document.getElementById(
                "userName"
            ).textContent = user.name;

        }


        // ==================== LOAD BLOGS ====================

        async function loadBlogs() {

            const blogList =
                document.getElementById("blogList");

            const totalBlogs =
                document.getElementById("totalBlogs");

            try {

                const response = await fetch(
                    `${API_URL}/api/blogs`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


                // Token invalid or expired

                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("loggedInUser");

                    window.location.href =
                        "login.html";

                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch blogs"
                    );

                }


                const blogs =
                    await response.json();


                console.log(
                    "My blogs:",
                    blogs
                );


                totalBlogs.textContent =
                    blogs.length;

                blogList.innerHTML = "";


                if (!blogs ||
                    blogs.length === 0) {

                    blogList.innerHTML =
                        "<p>No blogs found. Create your first blog!</p>";

                    return;

                }


                blogs.forEach(function (blog) {

                    const blogCard =
                        document.createElement("div");

                    blogCard.className =
                        "blog-card";


                    blogCard.innerHTML = `

                        <h2>${blog.title}</h2>

                        <p>
                            <strong>Author:</strong>
                            ${blog.author}
                        </p>

                        <p>
                            ${blog.content}
                        </p>

                        <p>
                            <strong>Published:</strong>
                            ${new Date(blog.created_at)
                                .toLocaleDateString()}
                        </p>

                        <div class="blog-actions">

                            <a
                                href="blog-details.html?id=${blog.id}"
                                class="action-button read-button">
                                Read More
                            </a>

                            <a
                                href="edit-blog.html?id=${blog.id}"
                                class="action-button edit-button">
                                Edit
                            </a>

                            <button
                                class="action-button delete-button"
                                onclick="deleteBlog(${blog.id})">
                                Delete
                            </button>

                        </div>

                    `;


                    blogList.appendChild(
                        blogCard
                    );

                });


            } catch (error) {

                console.error(
                    "Dashboard error:",
                    error
                );

                blogList.innerHTML =
                    "<p>Unable to load blogs. Please make sure the backend server is running.</p>";

            }

        }


        // ==================== DELETE BLOG ====================

        async function deleteBlog(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this blog?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/blogs/${id}`,
                        {
                            method: "DELETE",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const result =
                    await response.json();


                if (response.status === 401 ||
                    response.status === 403) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("loggedInUser");

                    window.location.href =
                        "login.html";

                    return;

                }


                if (!response.ok) {

                    alert(
                        result.message ||
                        "Failed to delete blog."
                    );

                    return;

                }


                alert(
                    "Blog deleted successfully!"
                );


                loadBlogs();


            } catch (error) {

                console.error(
                    "Delete error:",
                    error
                );

                alert(
                    "Unable to delete blog."
                );

            }

        }


        // ==================== LOGOUT ====================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            localStorage.removeItem(
                "loggedInUser"
            );

            window.location.href =
                "login.html";

        }


        // ==================== START ====================

        loadBlogs();

    </script>

</body>

</html>
