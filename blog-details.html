<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details - My Blog</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>My Blog</h2>

        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="create-blog.html">Create Blog</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>


    <!-- Blog Details -->
    <div class="container">

        <h1 id="blogTitle">Loading...</h1>

        <p>
            <strong>Author:</strong>
            <span id="blogAuthor"></span>
        </p>

        <p>
            <strong>Date:</strong>
            <span id="blogDate"></span>
        </p>

        <hr>

        <div id="blogContent"></div>

        <br>

        <button onclick="goBack()">Back to Dashboard</button>

    </div>


    <script>

        // Check login
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }


        // Get blog ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get("id");


        // Load blog
        async function loadBlog() {

            try {

                const response = await fetch(
                    `http://localhost:5000/api/blogs/${blogId}`,
                    {
                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


                if (response.status === 401 || response.status === 403) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("loggedInUser");

                    window.location.href = "login.html";

                    return;
                }


                if (!response.ok) {

                    document.getElementById("blogTitle").textContent =
                        "Blog not found.";

                    return;
                }


                const blog = await response.json();


                document.getElementById("blogTitle").textContent =
                    blog.title;

                document.getElementById("blogAuthor").textContent =
                    blog.author;

                document.getElementById("blogContent").textContent =
                    blog.content;

                document.getElementById("blogDate").textContent =
                    new Date(blog.created_at).toLocaleString();

            }

            catch (error) {

                console.error("Error loading blog:", error);

                document.getElementById("blogTitle").textContent =
                    "Failed to load blog.";

            }

        }


        // Back to dashboard
        function goBack() {

            window.location.href = "dashboard.html";

        }


        // Logout
        function logout() {

            localStorage.removeItem("token");
            localStorage.removeItem("loggedInUser");

            window.location.href = "login.html";

        }


        loadBlog();

    </script>

</body>
</html>
